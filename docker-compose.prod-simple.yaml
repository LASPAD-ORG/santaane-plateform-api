# =============================================================================
# Santaane Platform - Production Docker Compose for Coolify (Sans PGBouncer)
# =============================================================================
# Version simplifiée sans PGBouncer pour démarrage rapide
# PostgreSQL peut gérer 100+ connexions directement
# =============================================================================

services:
  # ===========================================================================
  # API Service - FastAPI Application
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: santaane-api:latest
    restart: unless-stopped

    # Environment Variables
    environment:
      # Database Configuration (DIRECT connection to PostgreSQL)
      - DATABASE_URL=${DATABASE_URL:?postgresql+psycopg2://postgres:password@db:5432/santaane}
      - POSTGRES_USER=${POSTGRES_USER:?postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:?santaane}

      # JWT Configuration (required)
      - SECRET_KEY=${SECRET_KEY:?}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      # Application Configuration
      - APP_NAME=${APP_NAME:-Santaane API}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # CORS Configuration
      - CORS_ORIGINS=${CORS_ORIGINS:-*}

      # Pagination
      - DEFAULT_PAGE_SIZE=${DEFAULT_PAGE_SIZE:-20}
      - MAX_PAGE_SIZE=${MAX_PAGE_SIZE:-100}

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    labels:
      - coolify.managed=true
      - coolify.type=application
      - traefik.enable=true
      - traefik.http.routers.santaane-api.rule=Host(`${SERVICE_FQDN_API}`)
      - traefik.http.routers.santaane-api.entryPoints=https
      - traefik.http.routers.santaane-api.tls=true
      - traefik.http.routers.santaane-api.tls.certresolver=letsencrypt
      - traefik.http.services.santaane-api.loadbalancer.server.port=8000

  # ===========================================================================
  # Database Service - PostgreSQL 16
  # ===========================================================================
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      - POSTGRES_USER=${POSTGRES_USER:?postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:?santaane}
      - POSTGRES_HOST_AUTH_METHOD=md5
      - POSTGRES_INITDB_ARGS=--auth-host=md5

    volumes:
      - pgdata:/var/lib/postgresql/data

    # Augmenter max_connections pour compenser l'absence de PGBouncer
    command: postgres -c password_encryption=md5 -c max_connections=200

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    labels:
      - coolify.managed=true
      - coolify.type=database

    exclude_from_hc: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pgdata:
    driver: local
