[tool.poetry]
name = "santaane-api"
version = "0.1.0"
description = "Backend FastAPI for Santaane Platform"
authors = ["Hamadou Ba <hamadou@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
aiofiles = "^23.1.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlmodel = "^0.0.22"
alembic = "^1.14.0"
pydantic-settings = "^2.0.0"
asyncpg = "^0.29.0"
pyjwt = "^2.8.0"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-multipart = "^0.0.6"
email-validator = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
